<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food and Hunger</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #faf7f0;
      color: #504638;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 420px);
      padding: 24px;
    }

    .food-scene {
      height: 300px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .halo {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, #f5c66c 0%, #f9dea6 40%, transparent 70%);
      transform: scale(0.75);
    }

    .orange {
      position: relative;
      width: 100px;
      height: 96px;
      border-radius: 48% 48% 46% 46%;
      background: radial-gradient(circle at 32% 28%, #ffc153, #f18b20 65%, #de7115);
      box-shadow: inset -5px -6px 10px #c9661526;
    }

    .orange::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 14px;
      left: 47px;
      top: -9px;
      border-radius: 4px;
      background: #6c6636;
      transform: rotate(-12deg);
    }

    .orange::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 15px;
      left: 51px;
      top: -10px;
      border-radius: 90% 0 90% 0;
      background: #6c8748;
      transform: rotate(-8deg);
    }

    input {
      display: block;
      width: 100%;
      height: 32px;
      margin: 0;
      accent-color: #956126;
      cursor: pointer;
    }

    input:focus-visible {
      outline: 2px solid #785021;
      outline-offset: 5px;
      border-radius: 8px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-height: 440px) {
      .food-scene { height: 280px; }
      main { padding-top: 12px; padding-bottom: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="food-scene" role="img" aria-label="An orange surrounded by a halo representing anticipated appeal">
      <div class="halo" id="halo"></div>
      <div class="orange"></div>
    </div>
    <input id="hunger" type="range" min="0" max="100" value="50" aria-label="Hunger" aria-describedby="less-hungry more-hungry">
    <div class="slider-labels">
      <span id="less-hungry">Less hungry</span>
      <span id="more-hungry">More hungry</span>
    </div>
  </main>
  <script>
    const hungerSlider = document.getElementById('hunger');
    const halo = document.getElementById('halo');

    function updateHalo() {
      // The slider changes only the halo size, from 50% to 100%.
      const scale = 0.5 + Number(hungerSlider.value) / 200;
      halo.style.transform = 'scale(' + scale + ')';
    }

    hungerSlider.addEventListener('input', updateHalo);
    updateHalo();
  </script>
</body>
</html>
